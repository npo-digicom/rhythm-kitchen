<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFF4E2">
  <title>リズムキッチン ペトロス君と作る!ギリシャ料理</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- スマホの形の枠。iPhoneでは画面いっぱい、パソコンでは中央にスマホの形で表示 -->
<div id="app">

  <!-- ① トップページ(背景:ギリシャの窓とキッチン) -->
  <section id="screen-start" class="screen active" aria-label="トップページ">
    <!-- 空をときどき横切るアモネス君 -->
    <div id="home-amones" class="home-amones" aria-hidden="true"></div>
    <div class="scroll home-scroll">
      <div class="home-inner">
        <header class="home-head">
          <h1 class="home-title">リズムキッチン</h1>
          <p class="home-sub">ペトロス君と作る!ギリシャ料理</p>
        </header>

        <div class="home-middle">
          <div id="home-petros" class="home-petros" aria-hidden="true"></div>
          <div class="home-story" aria-live="polite">
            <p id="home-story-head" class="home-story-head" hidden><span id="home-story-label" class="home-story-label"></span></p>
            <p id="home-story-text" class="home-story-text"></p>
          </div>
        </div>

        <div class="home-bottom">
          <button id="btn-start" class="btn btn-primary btn-start" type="button" disabled>じゅんび中…</button>
          <div class="btn-pair">
            <button id="btn-zukan-from-start" class="btn btn-secondary" type="button">📖 食材図鑑</button>
            <button id="btn-book-from-start" class="btn btn-secondary" type="button">ペトロス君の物語</button>
          </div>
          <p id="load-error" class="load-error" hidden></p>
          <p id="home-credit" class="home-credit"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ② ゲーム画面 -->
  <section id="screen-game" class="screen" aria-label="ゲーム">
    <div id="field">
      <div id="hud">
        <div class="hud-row">
          <span class="hud-icon" aria-hidden="true">⏳</span>
          <div id="timer-bar" role="progressbar" aria-label="のこり時間"><div id="timer-fill"></div><div id="timer-marks"></div></div>
        </div>
        <!-- 注文カード:注文の料理に使う食材。すくうと ✓ -->
        <div id="order-card" class="order-card-hud" hidden>
          <span id="order-card-pelican" class="order-card-pelican"></span>
          <div class="order-card-body">
            <p class="order-card-title">注文:<b id="order-card-name"></b></p>
            <ul id="order-card-ings" class="order-card-ings"></ul>
          </div>
        </div>
      </div>

      <div id="ingredients-layer"></div>

      <!-- ザル(画面下)。終盤に料理の器に変わる -->
      <div id="basket" aria-hidden="true">
        <div id="pile"></div>
        <div id="vessel-art" class="vessel-art"></div>
      </div>

      <div id="effects-layer"></div>

      <div id="catch-msg" aria-live="polite"></div>

      <!-- ペリカンのひとこと(ゲーム中) -->
      <div id="pelican-pop" aria-live="polite" hidden>
        <div id="pelican-pop-art" class="pelican-pop-art"></div>
        <div id="pelican-pop-text" class="speech"></div>
      </div>

      <!-- ペリカンの注文(始まる前) -->
      <div id="order-overlay" class="order-overlay" hidden>
        <div class="order-card">
          <div id="order-pelican" class="order-pelican"></div>
          <p id="order-text" class="speech speech-big"></p>
          <p class="order-hint">光る食材をすくいましょう</p>
          <ul id="order-ings" class="order-ings"></ul>
          <button id="btn-order-ok" class="btn btn-primary" type="button">まかせて!</button>
        </div>
      </div>

      <div id="start-count" class="big-text" hidden></div>
      <div id="finale-text" class="big-text" hidden></div>
      <div id="msg-text" class="big-text msg-text" hidden></div>
    </div>
  </section>

  <!-- ③ 完成画面 -->
  <section id="screen-complete" class="screen" aria-label="完成">
    <div class="scroll">
      <div class="complete-inner">
        <div id="order-result" class="order-result">
          <div id="order-result-pelican" class="order-result-pelican"></div>
          <p id="order-result-text" class="speech"></p>
        </div>
        <p class="complete-kicker">できあがり!</p>
        <h2 id="dish-name" class="dish-name"></h2>
        <p id="dish-subtitle" class="dish-subtitle"></p>

        <div id="dish-visual" class="dish-visual"></div>
        <p id="portion-badge" class="portion-badge"></p>
        <p id="portion-message" class="portion-message"></p>

        <!-- 新しいおはなしの知らせ(タップで読む) -->
        <div id="story-notices" class="story-notices"></div>

        <div class="card caught-card">
          <h3 class="card-title">すくった食材</h3>
          <ul id="caught-list" class="caught-list"></ul>
        </div>

        <div class="card recipe-card">
          <h3 class="card-title">🍳 今日作れる、かんたんレシピ</h3>
          <p id="recipe-title" class="recipe-title"></p>
          <p class="recipe-sub">材料 <span id="recipe-servings"></span></p>
          <ul id="recipe-materials" class="recipe-materials"></ul>
          <p class="recipe-sub">作り方</p>
          <ol id="recipe-steps" class="recipe-steps"></ol>
        </div>

        <div class="btn-pair">
          <button id="btn-zukan-from-complete" class="btn btn-secondary" type="button">📖 食材図鑑</button>
          <button id="btn-book-from-complete" class="btn btn-secondary" type="button">📜 ペトロス君の物語</button>
        </div>
      </div>
    </div>
    <!-- 「もう一度遊ぶ」は、いつも画面の下に見えるようにする -->
    <div class="complete-foot">
      <button id="btn-retry" class="btn btn-primary" type="button">もう一度遊ぶ</button>
    </div>
    <div id="celebrate-layer" aria-hidden="true"></div>
  </section>

  <!-- ④ 食材図鑑 -->
  <section id="screen-zukan" class="screen" aria-label="食材図鑑">
    <header class="zukan-header">
      <button id="btn-zukan-back" class="btn-back" type="button">← もどる</button>
      <h2 class="zukan-title">食材図鑑</h2>
    </header>
    <div class="scroll">
      <p id="zukan-progress" class="zukan-progress"></p>
      <ul id="zukan-grid" class="zukan-grid"></ul>
    </div>

    <div id="zukan-detail" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="zukan-detail-name">
      <div class="modal-card">
        <div id="zukan-detail-icon" class="detail-icon"></div>
        <h3 id="zukan-detail-name" class="detail-name"></h3>
        <p id="zukan-detail-motion" class="detail-motion"></p>
        <p id="zukan-detail-text" class="detail-text"></p>
        <button id="btn-zukan-close" class="btn btn-primary" type="button">とじる</button>
      </div>
    </div>
  </section>

  <!-- ⑤ ペトロス君の物語 -->
  <section id="screen-book" class="screen" aria-label="ペトロス君の物語">
    <header class="zukan-header">
      <button id="btn-book-back" class="btn-back" type="button">← もどる</button>
      <h2 id="book-title" class="zukan-title">ペトロス君の物語</h2>
    </header>
    <div class="scroll">
      <div class="book-inner">
        <div class="book-banner">
          <div id="book-banner-art" class="book-banner-art" aria-hidden="true"></div>
          <p id="book-progress" class="book-progress"></p>
        </div>
        <section class="book-section">
          <h3 id="book-characters-heading" class="book-heading">登場するみんな</h3>
          <ul id="book-characters" class="book-characters"></ul>
        </section>
        <section class="book-section">
          <h3 id="book-chapters-heading" class="book-heading">本編</h3>
          <ul id="book-chapters" class="book-chapters"></ul>
        </section>
      </div>
    </div>
  </section>

  <!-- おはなしを読む画面(どの画面からでも開く) -->
  <div id="reader" class="modal reader" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
    <div class="modal-card reader-card">
      <p id="reader-label" class="reader-label"></p>
      <div id="reader-art" class="reader-art"></div>
      <h3 id="reader-title" class="reader-title"></h3>
      <p id="reader-text" class="reader-text"></p>
      <div id="reader-foot" class="reader-foot" hidden>
        <p id="reader-disclaimer" class="reader-disclaimer"></p>
        <p id="reader-credit" class="reader-credit"></p>
      </div>
      <button id="btn-reader-close" class="btn btn-primary" type="button">とじる</button>
    </div>
  </div>

  <!-- 音のオン・オフ(どの画面でも右上) -->
  <button id="btn-sound" class="btn-sound" type="button" aria-pressed="false" aria-label="音を消す">
    <span id="sound-icon" class="sound-icon" aria-hidden="true">🔊</span>
    <span id="sound-label" class="sound-label">音あり</span>
  </button>

</div>

<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/motions.js"></script>
<script src="js/zukan.js"></script>
<script src="js/story.js"></script>
<script src="js/dishes.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
